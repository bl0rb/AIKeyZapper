name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check translations
        run: python3 scripts/l10n_check.py

      - name: Test
        run: swift test

      - name: Build package
        run: VERSION="$GITHUB_REF_NAME" scripts/build-pkg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/KeyZapper-$GITHUB_REF_NAME.pkg" \
            --title "KeyZapper $GITHUB_REF_NAME" --generate-notes
