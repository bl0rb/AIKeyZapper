<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="keyzapper-runtime-title keyzapper-runtime-desc">
        <title id="keyzapper-runtime-title">KeyZapper zur Laufzeit</title>
        <desc id="keyzapper-runtime-desc">Claude Code in Repo A und Repo B ruft jeweils keyzapper-helper mit der eigenen Profil-ID auf, der Helper liest genau diesen Key aus der lokalen Key-Datei, und Claude sendet die Anfrage mit Key A bzw. Key B an LiteLLM.</desc>
        <defs>
          <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <marker id="rt-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="rt-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- LIFELINES: x = 120, 300, 500, 700, 880 -->
        <line x1="120" y1="104" x2="120" y2="568" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="300" y1="104" x2="300" y2="568" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="500" y1="104" x2="500" y2="568" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="700" y1="104" x2="700" y2="568" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="880" y1="104" x2="880" y2="568" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ACTIVATION BARS -->
        <rect x="496" y="152" width="8" height="120" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="0.8"/>
        <rect x="696" y="192" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="496" y="376" width="8" height="120" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="0.8"/>
        <rect x="696" y="416" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- MESSAGES: Sitzung A -->
        <line x1="120" y1="152" x2="496" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rt-arrow)"/>
        <line x1="504" y1="192" x2="696" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rt-arrow)"/>
        <line x1="696" y1="232" x2="504" y2="232" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#rt-arrow)"/>
        <line x1="496" y1="272" x2="120" y2="272" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#rt-arrow)"/>
        <line x1="120" y1="312" x2="880" y2="312" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#rt-arrow-link)"/>
        <!-- MESSAGES: Sitzung B -->
        <line x1="300" y1="376" x2="496" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rt-arrow)"/>
        <line x1="504" y1="416" x2="696" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rt-arrow)"/>
        <line x1="696" y1="456" x2="504" y2="456" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#rt-arrow)"/>
        <line x1="496" y1="496" x2="300" y2="496" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#rt-arrow)"/>
        <line x1="300" y1="536" x2="880" y2="536" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#rt-arrow-link)"/>

        <!-- MESSAGE LABELS (masked, between lifelines, 8px gap) -->
        <rect x="176" y="132" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="212" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">--PROFILE A</text>
        <rect x="560" y="172" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="600" y="181" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LIEST KEY A</text>
        <rect x="572" y="212" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="600" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KEY A</text>
        <rect x="352" y="252" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="400" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STDOUT · KEY A</text>
        <rect x="748" y="292" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="792" y="301" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">X-API-KEY: A</text>

        <rect x="364" y="356" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="400" y="365" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">--PROFILE B</text>
        <rect x="560" y="396" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="600" y="405" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LIEST KEY B</text>
        <rect x="572" y="436" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="600" y="445" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KEY B</text>
        <rect x="352" y="476" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="400" y="485" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STDOUT · KEY B</text>
        <rect x="748" y="516" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="792" y="525" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">X-API-KEY: B</text>

        <!-- ACTORS (drawn last) -->
        <!-- Claude Code · Repo A -->
        <rect x="40" y="40" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="40" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="48" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="62" y="55" fill="rgba(122,131,153,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IDE</text>
        <text x="120" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claude Code</text>
        <text x="120" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Repo A · VS Code</text>
        <!-- Claude Code · Repo B -->
        <rect x="220" y="40" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="220" y="40" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="228" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="242" y="55" fill="rgba(122,131,153,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IDE</text>
        <text x="300" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claude Code</text>
        <text x="300" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Repo B · IntelliJ</text>
        <!-- keyzapper-helper (focal) -->
        <rect x="420" y="40" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="40" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="428" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
        <text x="442" y="55" fill="rgba(235,108,54,0.85)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
        <text x="500" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">keyzapper-helper</text>
        <text x="500" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">credential --profile</text>
        <!-- Key file -->
        <rect x="620" y="40" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="620" y="40" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="628" y="46" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="644" y="55" fill="rgba(79,93,117,0.85)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="700" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Key-Datei</text>
        <text x="700" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">keys.json</text>
        <!-- LiteLLM (external) -->
        <rect x="800" y="40" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="800" y="40" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="808" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="822" y="55" fill="rgba(45,49,66,0.6)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="880" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LiteLLM</text>
        <text x="880" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ Amazon Bedrock</text>

        <!-- LEGEND -->
        <line x1="40" y1="596" x2="960" y2="596" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="624" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDE</text>
        <line x1="128" y1="620" x2="160" y2="620" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rt-arrow)"/>
        <text x="168" y="624" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Aufruf</text>
        <line x1="248" y1="620" x2="280" y2="620" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#rt-arrow)"/>
        <text x="288" y="624" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Antwort</text>
        <line x1="368" y1="620" x2="400" y2="620" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#rt-arrow-link)"/>
        <text x="408" y="624" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">HTTPS-Anfrage an LiteLLM</text>
        <rect x="568" y="614" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="592" y="624" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Fokus: einziger Key-Datei-Zugriff</text>
      </svg>
