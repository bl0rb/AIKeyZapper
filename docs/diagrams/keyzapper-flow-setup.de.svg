<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="keyzapper-setup-title keyzapper-setup-desc">
        <title id="keyzapper-setup-title">KeyZapper-Einrichtung</title>
        <desc id="keyzapper-setup-desc">Der Entwickler gibt in KeyZapper Profil und Key ein; die App speichert den Key über keyzapper-helper im Schlüsselbund und schreibt in Repo A und Repo B je eine settings.local.json mit apiKeyHelper und LiteLLM-Endpunkt.</desc>
        <defs>
          <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <marker id="setup-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ARROWS (before nodes) -->
        <!-- A1 Entwickler → App -->
        <line x1="168" y1="240" x2="256" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#setup-arrow)"/>
        <!-- A2 App (top) → helper -->
        <path d="M 336,200 V 80 Q 336,72 344,72 H 528" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#setup-arrow)"/>
        <!-- A3 helper → Schlüsselbund -->
        <line x1="704" y1="72" x2="800" y2="72" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#setup-arrow)"/>
        <!-- A4 App → Repo A -->
        <line x1="416" y1="224" x2="528" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#setup-arrow)"/>
        <!-- A5 App → Repo B -->
        <path d="M 416,256 H 456 Q 464,256 464,264 V 344 Q 464,352 472,352 H 528" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#setup-arrow)"/>

        <!-- ARROW LABELS (masked, 8px gap) -->
        <rect x="176" y="220" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="212" y="229" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROFIL · KEY</text>
        <rect x="392" y="52" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="436" y="61" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STORE · STDIN</text>
        <rect x="712" y="52" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="752" y="61" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KEY A · KEY B</text>
        <rect x="440" y="204" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="472" y="213" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROFIL A</text>
        <rect x="400" y="296" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="428" y="305" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROFIL B</text>

        <!-- NODES -->
        <!-- Entwickler (input) -->
        <rect x="40" y="208" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="208" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="48" y="214" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="62" y="223" fill="rgba(122,131,153,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="104" y="246" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Entwickler</text>
        <text x="104" y="262" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">einmalig</text>

        <!-- KeyZapper.app (focal) -->
        <rect x="256" y="200" width="160" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="200" width="160" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="264" y="206" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
        <text x="278" y="215" fill="rgba(235,108,54,0.85)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="336" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">KeyZapper.app</text>
        <text x="336" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Profile · Zuordnungen</text>

        <!-- keyzapper-helper (backend) -->
        <rect x="528" y="40" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="528" y="40" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="536" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="550" y="55" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
        <text x="616" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">keyzapper-helper</text>
        <text x="616" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">store --profile &lt;id&gt;</text>

        <!-- Schlüsselbund (store) -->
        <rect x="800" y="40" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="800" y="40" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="808" y="46" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="824" y="55" fill="rgba(79,93,117,0.85)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="880" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Schlüsselbund</text>
        <text x="880" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">KeyZapper.LiteLLM</text>

        <!-- Repo A -->
        <rect x="528" y="176" width="240" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="528" y="176" width="240" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="536" y="182" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="550" y="191" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPO</text>
        <text x="648" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Repo A</text>
        <text x="648" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">.claude/settings.local.json</text>
        <text x="648" y="244" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">apiKeyHelper → --profile A</text>
        <text x="648" y="260" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ANTHROPIC_BASE_URL → LiteLLM</text>

        <!-- Repo B -->
        <rect x="528" y="304" width="240" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="528" y="304" width="240" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="536" y="310" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="550" y="319" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPO</text>
        <text x="648" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Repo B</text>
        <text x="648" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">.claude/settings.local.json</text>
        <text x="648" y="372" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">apiKeyHelper → --profile B</text>
        <text x="648" y="388" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ANTHROPIC_BASE_URL → LiteLLM</text>

        <!-- LEGEND -->
        <line x1="40" y1="436" x2="960" y2="436" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDE</text>
        <rect x="128" y="456" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="152" y="465" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Fokus</text>
        <rect x="248" y="456" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="272" y="465" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Komponente / Projekt</text>
        <rect x="408" y="456" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="432" y="465" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Speicher</text>
        <rect x="528" y="456" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="552" y="465" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Person</text>
      </svg>
